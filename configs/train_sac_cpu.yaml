# SAC training configuration. Run with:
#   python train.py --config configs/train_sac.yaml
#
# Added to fix PPO's std-collapse local minimum (see configs/train.yaml's
# PPO run: eval reward flatlines after ~15 iterations because the policy's
# tanh-squashed mean saturates while log_std collapses). SAC's squashed
# Gaussian policy applies the tanh-Jacobian correction properly and
# auto-tunes its entropy coefficient against a target entropy, which
# actively resists that collapse.

algo: sac

seed: 67

env:
  xml_path: huarm/arm.xml
  num_envs: 1
  episode_length: 512
  n_frames: 20  # control freq = 0.002 * n_frames -> 25Hz at 20
  # Domain randomization (see envs/utils_dr.py, envs/utils_noise.py and the
  # README). Both default to on; these are the knobs, not new behaviour:
  #   dr_config: {enabled: false}            # no physics randomization
  #   dr_config: {bow_mass_range: [0.5, 1.5]}
  #   obs_noise_scale: 0.0                   # no observation noise
  #   obs_noise: {force: [{kind: white, scale: 0.1}]}

agent:
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4
  alpha_lr: 3.0e-4
  gamma: 0.99
  tau: 0.005
  batch_size: 256
  buffer_capacity: 500000
  gradient_steps: 32
  min_buffer_size: 10000
  hidden_dim: 256
  max_grad_norm: 1.0
  alpha_max_grad_norm: 1.0

train:
  num_iterations: 800
  steps_per_iteration: 128
  eval_interval: 100
  eval_episodes: 16
  live_plot: false
  metrics_path: metrics_sac_compliant_rlpd.png
  checkpoint_path: checkpoints/sac_model_compliant_rlpd
