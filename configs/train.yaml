# Default training configuration. Override with:
#   python train.py --config configs/my_variant.yaml

seed: 0

env:
  num_envs: 64
  episode_length: 512
  n_frames: 20  # control freq = 0.002 * n_frames -> 25Hz at 20

agent:
  lr: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  num_epochs: 4
  num_minibatches: 8
  max_grad_norm: 0.5

train:
  num_iterations: 400
  steps_per_iteration: 128
  eval_interval: 10
  live_plot: false
  metrics_path: metrics.png
  checkpoint_path: checkpoints/model_latest
